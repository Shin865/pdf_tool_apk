name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      - name: Report Coverage for Critical Subsystems
        run: |
          python3 -c "
          with open('coverage/lcov.info', 'r') as f:
              lines = f.readlines()
          stats = {}
          cur = ''
          for l in lines:
              l = l.strip()
              if l.startswith('SF:'):
                  cur = l[3:]
                  stats[cur] = {'lf': 0, 'lh': 0}
              elif l.startswith('LF:'):
                  stats[cur]['lf'] = int(l[3:])
              elif l.startswith('LH:'):
                  stats[cur]['lh'] = int(l[3:])
          
          print('=== SUBSYSTEM COVERAGE REPORT ===')
          targets = ['save_coordinator', 'storage_directory_manager', 'database', 'engine_impl', 'app_lock', 'backup_service']
          for k in sorted(stats.keys()):
              if any(t in k for t in targets):
                  lf, lh = stats[k]['lf'], stats[k]['lh']
                  pct = (lh / lf * 100) if lf > 0 else 0
                  print(f'  {k:<55}: {pct:5.1f}% ({lh}/{lf})')
          "

  emulator-matrix:
    name: Emulator Test (API ${{ matrix.api-level }} - ${{ matrix.profile }})
    runs-on: macos-13
    needs: test
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28, 33, 34]
        profile: ['phone', 'tablet']
        include:
          - profile: 'phone'
            device-profile: 'pixel_6'
          - profile: 'tablet'
            device-profile: 'pixel_tablet'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Android Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device-profile }}
          script: flutter test integration_test/app_flow_test.dart

  build-release:
    name: Build Release (AAB + Split APKs) & 16KB Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Build Split APKs per ABI
        run: flutter build apk --release --split-per-abi

      - name: Verify 16KB Page Alignment on ELF Shared Libraries
        run: |
          python3 -c "
          import zipfile, struct, glob, sys

          apks = glob.glob('build/app/outputs/flutter-apk/*-release.apk')
          if not apks:
              # Fallback to any built release or debug APK
              apks = glob.glob('build/app/outputs/flutter-apk/*.apk')
          if not apks:
              print('Error: No APKs found for 16KB page alignment verification!')
              sys.exit(1)

          all_passed = True
          for apk in apks:
              print(f'Auditing 16KB alignment for: {apk}...')
              with zipfile.ZipFile(apk, 'r') as z:
                  for name in z.namelist():
                      if name.endswith('.so'):
                          data = z.read(name)
                          if len(data) < 64 or data[:4] != b'\x7fELF':
                              continue
                          is_64 = (data[4] == 2)
                          phoff = struct.unpack('<Q' if is_64 else '<I', data[32:40] if is_64 else data[28:32])[0]
                          phentsize = struct.unpack('<H', data[54:56] if is_64 else data[42:44])[0]
                          phnum = struct.unpack('<H', data[56:58] if is_64 else data[44:46])[0]

                          max_align = 0
                          for i in range(phnum):
                              off = phoff + i * phentsize
                              ptype = struct.unpack('<I', data[off:off+4])[0]
                              if ptype == 1: # PT_LOAD
                                  align = struct.unpack('<Q' if is_64 else '<I', data[off+48:off+56] if is_64 else data[off+28:off+32])[0]
                                  max_align = max(max_align, align)
                          print(f'  {name}: max PT_LOAD alignment = {max_align} bytes ({max_align // 1024} KB)')
                          if is_64 and max_align < 16384:
                              print(f'  FAILED: {name} in {apk} has alignment < 16 KB!')
                              all_passed = False
          if not all_passed:
              sys.exit(1)
          print('All 64-bit ELF shared libraries strictly satisfy >= 16 KB alignment requirements.')
          "

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
