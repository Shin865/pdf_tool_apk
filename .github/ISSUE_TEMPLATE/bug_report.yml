name: Bug Report
description: Laporkan bug, kegagalan render, atau perilaku tak terduga
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih telah melaporkan bug. Pastikan tidak ada data rahasia atau dokumen pribadi dalam laporan ini.
  - type: input
    id: version
    attributes:
      label: Versi Aplikasi & Build
      placeholder: "1.0.0 (Build 100)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Perangkat & Versi Android
      placeholder: "Google Pixel 7 - Android 14 / Samsung Tab S9 - Android 13"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Langkah-langkah Reproduksi Masalah
      placeholder: |
        1. Buka dokumen '...'
        2. Pilih menu '...'
        3. Terjadi kesalahan '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang Diharapkan
      placeholder: Dokumen terbuka tanpa error dan tabel ter-render rapi.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / Tangkapan Layar Tambahan
      placeholder: Tempel pesan error atau lampirkan tangkapan layar di sini (pastikan informasi sensitif disensor).
