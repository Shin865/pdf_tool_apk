plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.documentreviewer"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.documentreviewer"
        minSdk = 26
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                def storeFilePath = keystoreProperties['storeFile']
                def sf = file(storeFilePath)
                if (!sf.isAbsolute()) {
                    sf = rootProject.file(storeFilePath)
                }
                if (!sf.exists()) {
                    throw new IllegalStateException("Keystore file not found at: ${sf.absolutePath}")
                }
                storeFile sf
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (System.getenv("KEYSTORE_PATH")) {
                def envKeystore = file(System.getenv("KEYSTORE_PATH"))
                if (!envKeystore.exists()) {
                    throw new IllegalStateException("Keystore file from KEYSTORE_PATH not found: ${envKeystore.absolutePath}")
                }
                storeFile envKeystore
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else {
                def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
                if (isReleaseTask) {
                    throw new IllegalStateException("Release signing configuration missing! Please provide android/key.properties or set environment variables (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).")
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt',
                         'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module',
                         'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def baseCode = flutter.versionCode ? flutter.versionCode.toInteger() : 1
            def abiOffset = 0
            if (abi == 'armeabi-v7a') {
                abiOffset = 1
            } else if (abi == 'arm64-v8a') {
                abiOffset = 2
            } else if (abi == 'x86_64') {
                abiOffset = 3
            } else {
                abiOffset = 0 // universal
            }
            output.versionCodeOverride = (baseCode * 10) + abiOffset
        }
    }
}

dependencies {
    // Apache POI 5.3.0 for DOCX & XLSX manipulation (Apache-2.0)
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.xmlbeans:xmlbeans:5.2.1'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'

    // PdfBox-Android for PDF text search, highlight & annotations (Apache-2.0)
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'

    testImplementation 'junit:junit:4.13.2'
}

flutter {
    source = "../.."
}
