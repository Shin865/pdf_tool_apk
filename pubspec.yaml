name: document_reviewer
description: "Offline-first document reviewer for Android. No ads, no accounts, no backend."
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: ^3.5.4

dependencies:
  crypto: ^3.0.3
  drift: ^2.20.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.4
  go_router: ^14.3.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  logging: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.4
  riverpod_annotation: ^2.3.5
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.4.2

dev_dependencies:
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  riverpod_generator: ^2.4.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/
    - assets/licenses/
    - assets/ocr/
